<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="cashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051014"/>
      <stop offset="50%" stop-color="#0a1a24"/>
      <stop offset="100%" stop-color="#03080b"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="cashBlob" cx="60%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="cashShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#cashBg)"/>
  <rect width="1200" height="750" fill="url(#cashBlob)"/>

  <!-- Browser Frame -->
  <g transform="translate(100, 80)" filter="url(#cashShadow)">
    <rect width="1000" height="590" rx="16" fill="#0d1921" stroke="#16384a" stroke-width="1.5"/>
    <rect width="1000" height="48" rx="16" fill="#132733"/>
    <rect y="32" width="1000" height="16" fill="#132733"/>
    <circle cx="28" cy="24" r="6" fill="#ef4444"/>
    <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="24" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="180" y="12" width="640" height="24" rx="6" fill="#09141b"/>
    <text x="500" y="28" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">https://cashbook.ashikbuilds.app</text>

    <!-- Header Stats -->
    <rect x="32" y="72" width="936" height="130" rx="12" fill="#10222d" stroke="#1a3b4e"/>
    <text x="60" y="120" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="30">CashBook — Offline-First Financial Ledger</text>
    <text x="60" y="150" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Dexie.js (IndexedDB) · PostgreSQL · Neon · Drizzle ORM · Delta Sync Engine</text>
    
    <g transform="translate(60, 165)">
      <rect width="120" height="22" rx="6" fill="#10b981" fill-opacity="0.2"/>
      <text x="60" y="15" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Offline-First PWA</text>
      <rect x="130" width="110" height="22" rx="6" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="185" y="15" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Integer Math (0% Err)</text>
      <rect x="250" width="120" height="22" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="310" y="15" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Multi-Tenant RBAC</text>
    </g>

    <!-- Ledger Metrics Cards -->
    <rect x="32" y="222" width="296" height="110" rx="10" fill="#112735" stroke="#1c455d"/>
    <text x="56" y="254" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">TOTAL INFLOW</text>
    <text x="56" y="295" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28">$142,850.00</text>

    <rect x="352" y="222" width="296" height="110" rx="10" fill="#112735" stroke="#1c455d"/>
    <text x="376" y="254" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">TOTAL OUTFLOW</text>
    <text x="376" y="295" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28">$48,210.00</text>

    <rect x="672" y="222" width="296" height="110" rx="10" fill="#112735" stroke="#1c455d"/>
    <text x="696" y="254" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">SYNC STATUS</text>
    <circle cx="704" cy="286" r="6" fill="#10b981"/>
    <text x="720" y="292" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18">Cloud Synced</text>

    <!-- Ledger Table Wireframe -->
    <rect x="32" y="352" width="936" height="210" rx="10" fill="#10222d" stroke="#1a3b4e"/>
    <rect x="32" y="352" width="936" height="40" rx="10" fill="#142c3b"/>
    <text x="56" y="377" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">DATE</text>
    <text x="220" y="377" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">TRANSACTION / MERCHANT</text>
    <text x="600" y="377" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CATEGORY</text>
    <text x="880" y="377" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">AMOUNT</text>

    <!-- Table Rows -->
    <line x1="32" y1="432" x2="968" y2="432" stroke="#183547" stroke-width="1"/>
    <text x="56" y="418" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Today, 02:45 PM</text>
    <text x="220" y="418" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Client Retainer Milestone (Stripe)</text>
    <text x="600" y="418" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Revenue</text>
    <text x="880" y="418" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">+$4,500.00</text>

    <line x1="32" y1="476" x2="968" y2="476" stroke="#183547" stroke-width="1"/>
    <text x="56" y="460" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Yesterday</text>
    <text x="220" y="460" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Cloudflare R2 & Neon DB Hosting</text>
    <text x="600" y="460" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Infrastructure</text>
    <text x="880" y="460" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">-$89.50</text>
  </g>
</svg>
