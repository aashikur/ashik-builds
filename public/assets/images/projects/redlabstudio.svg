<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="redBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="50%" stop-color="#1f0a0e"/>
      <stop offset="100%" stop-color="#080203"/>
    </linearGradient>
    <linearGradient id="crimsonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="redBlob" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="redShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#redBg)"/>
  <rect width="1200" height="750" fill="url(#redBlob)"/>

  <!-- Browser Frame -->
  <g transform="translate(100, 80)" filter="url(#redShadow)">
    <rect width="1000" height="590" rx="16" fill="#170c0e" stroke="#3b151a" stroke-width="1.5"/>
    <rect width="1000" height="48" rx="16" fill="#241014"/>
    <rect y="32" width="1000" height="16" fill="#241014"/>
    <circle cx="28" cy="24" r="6" fill="#ef4444"/>
    <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="24" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="180" y="12" width="640" height="24" rx="6" fill="#0f0507"/>
    <text x="500" y="28" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">https://redlabstudio.com</text>

    <!-- Top Banner -->
    <rect x="32" y="72" width="936" height="130" rx="12" fill="#220e11" stroke="#3b161c"/>
    <text x="60" y="120" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="30">RedLabStudio — Video Course LMS</text>
    <text x="60" y="150" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Next.js 16 · Node.js · Express · MongoDB · Tiptap Rich Editor · SSLCommerz</text>
    
    <g transform="translate(60, 165)">
      <rect width="130" height="22" rx="6" fill="#ef4444" fill-opacity="0.2"/>
      <text x="65" y="15" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Multi-Role LMS</text>
      <rect x="140" width="140" height="22" rx="6" fill="#f43f5e" fill-opacity="0.2"/>
      <text x="210" y="15" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tiptap Course Editor</text>
      <rect x="290" width="130" height="22" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="355" y="15" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Automated Enrollments</text>
    </g>

    <!-- Rich Editor & Video Studio Wireframe -->
    <rect x="32" y="222" width="540" height="340" rx="12" fill="#261014" stroke="#451820"/>
    <rect x="52" y="242" width="500" height="40" rx="6" fill="#1c0b0e"/>
    <circle cx="72" cy="262" r="5" fill="#f43f5e"/>
    <text x="90" y="267" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">B</text>
    <text x="110" y="267" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic">I</text>
    <text x="130" y="267" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Link</text>
    <text x="170" y="267" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Code Block</text>

    <!-- Editor Content Area -->
    <rect x="52" y="294" width="500" height="248" rx="8" fill="#1a0a0d"/>
    <text x="76" y="330" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20">Lesson 01: Production Video Editing Fundamentals</text>
    <text x="76" y="360" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">In this comprehensive module, students learn dynamic timeline pacing, B-roll integration,</text>
    <text x="76" y="385" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">and sound design workflows tailored for high-converting social video content.</text>
    <rect x="76" y="415" width="452" height="60" rx="6" fill="#2b1116"/>
    <text x="96" y="445" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-family="monospace">// Automated SSLCommerz Webhook Execution</text>
    <text x="96" y="462" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-family="monospace">await enrollStudent({ userId, courseId, transactionId });</text>

    <!-- Course Certificate Preview -->
    <rect x="592" y="222" width="376" height="340" rx="12" fill="#220e11" stroke="#3b161c"/>
    <rect x="616" y="246" width="328" height="210" rx="10" fill="#17090b" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="780" y="295" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" text-anchor="middle">CERTIFICATE OF COMPLETION</text>
    <text x="780" y="335" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" text-anchor="middle">Student Achievement Award</text>
    <text x="780" y="365" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Verified on-chain / SSLCommerz Verified</text>
    <circle cx="780" cy="410" r="20" fill="url(#crimsonGlow)"/>

    <rect x="616" y="476" width="328" height="42" rx="8" fill="url(#crimsonGlow)"/>
    <text x="780" y="502" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Generate Official Certificate</text>
  </g>
</svg>
